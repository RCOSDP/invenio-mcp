name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}

      # **タグと __version__ が一致していること。** ずれると「v0.0.2 と名乗る
      # 0.0.1」が世に出る。版はコードが持つので、ここで突き合わせる。
      - name: tag matches __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in http/mcp_server.py stdio/server.py; do
            got="$(python3 -c "import re;print(re.search(r'^__version__ = \"([^\"]+)\"', open('$f').read(), re.M).group(1))")"
            test "$tag" = "$got" || { echo "tag=$tag but $f=$got"; exit 1; }
          done

      # **変更履歴にその版の節があること。** 無いまま出すと、利用者が
      # 「何が変わったのか」を調べる先が無くなる。
      - name: the changelog has this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in CHANGELOG.md CHANGELOG.ja.md; do
            grep -q "^## \[$tag\]" "$f" || { echo "$f has no section for $tag"; exit 1; }
          done

      - name: build the image the same way the manifests do
        run: docker build -t invenio-mcp:${GITHUB_REF_NAME} http/

      - name: draft the release notes from the changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk "/^## \[$tag\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
